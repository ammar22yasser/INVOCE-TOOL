<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حاسبة الفواتير</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%230E7C66'/%3E%3Cpath d='M14 9h15l7 7v23a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2V11a2 2 0 0 1 2-2z' fill='white'/%3E%3Cpath d='M17 22h14M17 27h14M17 32h8' stroke='%230E7C66' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='34' cy='34' r='8' fill='%2316302A'/%3E%3Cpath d='M30.5 34l2.6 2.6 4.6-5' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3F0;--card:#fff;--ink:#16302A;--mute:#5E7A72;--line:#D5E1DB;--acc:#0E7C66;--accsoft:#DDF0EA;--onacc:#fff;--out:#16302A;--onout:#EAF5F1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A17;--card:#182622;--ink:#E4F1EC;--mute:#8FAAA1;--line:#2A3E38;--acc:#3CC3A5;--accsoft:#173A32;--onacc:#06241D;--out:#E4F1EC;--onout:#10231E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1A17;--card:#182622;--ink:#E4F1EC;--mute:#8FAAA1;--line:#2A3E38;--acc:#3CC3A5;--accsoft:#173A32;--onacc:#06241D;--out:#E4F1EC;--onout:#10231E;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,Arial,sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:26px;font-weight:800;margin:6px 0 2px}
.brand{display:flex;align-items:center;gap:12px;margin-top:6px}
.brand svg{width:48px;height:48px;flex:none}
.brand h1{margin:0}
.sub{color:var(--mute);margin:0 0 18px}
h2{font-size:16px;font-weight:600;margin:22px 0 10px}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.type{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 8px;font:inherit;text-align:center;cursor:pointer}
.type b{display:block;font-size:15px}
.type small{display:block;color:var(--mute);font-size:12px;line-height:1.4;margin-top:2px}
.type[aria-pressed="true"]{border-color:var(--acc);background:var(--accsoft)}
.type:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:end}
.row label,.opt label{display:block;font-size:12px;color:var(--mute)}
input,select{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-width:0}
.del{border:0;background:none;color:var(--mute);font-size:22px;cursor:pointer;padding:6px}
.add{width:100%;border:2px dashed var(--line);background:none;color:var(--acc);font:inherit;font-weight:600;border-radius:10px;padding:9px;cursor:pointer}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum{background:var(--out);color:var(--onout);border-radius:14px;padding:16px;margin-top:22px}
.sum div{display:flex;justify-content:space-between;padding:4px 0}
.sum .minus{opacity:.8}
.sum .tot{border-top:1px solid currentColor;margin-top:8px;padding-top:10px;font-size:22px;font-weight:800}
.empty{opacity:.7;text-align:center}
.secs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:10px}
.th{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th button{position:absolute;top:4px;left:4px;width:26px;height:26px;border:0;border-radius:50%;background:var(--out);color:var(--onout);cursor:pointer;font-size:16px;line-height:1}
.note{color:var(--mute);font-size:12px;margin:10px 0 0}
table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
td:first-child{white-space:normal;min-width:140px}
.tt td{font-weight:800;border-top:2px solid var(--ink)}
.go{width:100%;border:0;background:var(--acc);color:var(--onacc);font:inherit;font-weight:800;border-radius:12px;padding:12px;cursor:pointer;margin-top:12px}
.go:disabled{opacity:.6;cursor:default}
.cp{margin-inline-start:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:12px;border-radius:8px;padding:2px 8px;cursor:pointer}
.cp.done{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
@media (max-width:420px){.types{grid-template-columns:1fr}.type{display:flex;gap:10px;align-items:baseline;text-align:right;padding:10px 12px}.row{grid-template-columns:1.6fr 1fr 1fr auto}}
</style>
</head>
<body>
<main>
<div class="brand"><svg viewBox="0 0 48 48" role="img" aria-label="شعار حاسبة الفواتير"><rect width="48" height="48" rx="12" fill="#0E7C66"/><path d="M14 9h15l7 7v23a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2V11a2 2 0 0 1 2-2z" fill="#fff"/><path d="M29 9v7h7z" fill="#CFE9E2"/><path d="M17 22h14M17 27h14M17 32h8" stroke="#0E7C66" stroke-width="2.4" stroke-linecap="round"/><circle cx="34" cy="34" r="8" fill="#16302A"/><path d="M30.5 34l2.6 2.6 4.6-5" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><h1>حاسبة الفواتير</h1></div>
<p class="sub">اختار نوع الفاتورة وادخل الأرقام، والحساب يظهر لحظيًا.</p>

<h2>القسم</h2>
<div class="secs" id="secs"></div>
<div id="coBox" class="card" style="margin-top:10px"></div>

<h2>صور مرفقة</h2>
<div class="card">
  <div class="secs"><button class="add" id="pick" type="button">من المعرض أو الكاميرا</button><button class="add" id="shoot" type="button">تصوير بالكاميرا</button></div>
  <input id="file" type="file" accept="image/*" multiple hidden>
  <input id="cam" type="file" accept="image/*" capture="environment" hidden>
  <div class="thumbs" id="thumbs"></div>
  <p class="note">الصور بتظهر على جهازك بس، ومش بتتحفظ بعد قفل الصفحة.</p>
</div>

<div id="calcBox"></div>
<div id="res"></div>

<div class="sum" id="sum" aria-live="polite"></div>
</main>

<script>
var TYPES={
 sales:{name:'فاتورة مبيعات',desc:'أصناف وكميات مع خصم وضريبة',cols:['الصنف','الكمية','السعر'],
  opts:[{id:'cur',label:'العملة',sel:['ج.م','ر.س','د.إ','$'],def:'ج.م'},{id:'disc',label:'خصم %',def:0},{id:'vat',label:'ضريبة القيمة المضافة %',def:14}]},
 services:{name:'فاتورة خدمات',desc:'ضريبة مضافة وخصم من المنبع',cols:['الخدمة','الكمية','السعر'],
  opts:[{id:'cur',label:'العملة',sel:['ج.م','ر.س','د.إ','$'],def:'ج.م'},{id:'vat',label:'ضريبة القيمة المضافة %',def:14},{id:'wh',label:'خصم من المنبع %',sel:['0','1','3','5'],def:'3'}],ded:{id:'wh',label:'خصم من المنبع'},net:'الصافي المستحق'},
 supply:{name:'فاتورة توريد',desc:'شراء بضاعة من مورد مع مصاريف نقل',cols:['الصنف','الكمية','سعر الشراء'],
  opts:[{id:'cur',label:'العملة',sel:['ج.م','ر.س','د.إ','$'],def:'ج.م'},{id:'vat',label:'ضريبة القيمة المضافة %',def:14},{id:'extra',label:'مصاريف نقل (بدون ضريبة)',def:0}]},
 bulk:{name:'بيع بالجملة',desc:'صرف كميات مع خصم كمية',cols:['الصنف','الكمية','سعر الجملة'],
  opts:[{id:'cur',label:'العملة',sel:['ج.م','ر.س','د.إ','$'],def:'ج.م'},{id:'disc',label:'خصم كمية %',def:0},{id:'vat',label:'ضريبة القيمة المضافة %',def:14}]},
 return:{name:'مرتجع',desc:'رد بضاعة مع رسوم إعادة تخزين',cols:['الصنف','الكمية المرتجعة','السعر'],
  opts:[{id:'cur',label:'العملة',sel:['ج.م','ر.س','د.إ','$'],def:'ج.م'},{id:'vat',label:'ضريبة القيمة المضافة %',def:14},{id:'rest',label:'رسوم إعادة التخزين %',def:0}],ded:{id:'rest',label:'رسوم إعادة التخزين'},net:'صافي المبلغ المسترد'},
 hourly:{name:'فاتورة بالساعة',desc:'ساعات × سعر الساعة + مصاريف',cols:['المهمة','الساعات','سعر الساعة'],
  opts:[{id:'cur',label:'العملة',sel:['ج.م','ر.س','د.إ','$'],def:'ج.م'},{id:'vat',label:'ضريبة القيمة المضافة %',def:14},{id:'extra',label:'مصاريف إضافية (بدون ضريبة)',def:0}]}
};
var SEC={co:['sales','services','hourly'],wh:['supply','bulk','return']};
var SECN={co:['الشركات','فواتير المبيعات والخدمات'],wh:['المخازن','التوريد والبيع بالجملة والمرتجعات']};
var sec='co',photos=[],pfiles=[];
var COS=['فارما أوفرسيز','ابن سينا','إخناتون'],co=COS[0],WHS=['الزهراء'],wr=WHS[0];
var cur='sales',rows=[{n:'',q:1,p:0}],vals={};
var $=function(i){return document.getElementById(i)};
function num(v){v=parseFloat(String(v).replace(',','.'));return isNaN(v)?0:v}
function fmt(n){return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}

function drawTypes(){
 $('types').innerHTML=SEC[sec].map(function(k){var t=TYPES[k];
  return '<button type="button" class="type" data-k="'+k+'" aria-pressed="'+(k===cur)+'"><b>'+t.name+'</b><small>'+t.desc+'</small></button>'}).join('');
 Array.prototype.forEach.call($('types').children,function(b){b.onclick=function(){cur=b.dataset.k;drawAll()}});
}
function drawRows(){
 var c=TYPES[cur].cols;
 $('rows').innerHTML=rows.map(function(r,i){
  return '<div class="row"><div><label>'+c[0]+'</label><input data-i="'+i+'" data-f="n" value="'+r.n.replace(/"/g,'&quot;')+'"></div>'+
  '<div><label>'+c[1]+'</label><input data-i="'+i+'" data-f="q" type="number" inputmode="decimal" min="0" value="'+r.q+'"></div>'+
  '<div><label>'+c[2]+'</label><input data-i="'+i+'" data-f="p" type="number" inputmode="decimal" min="0" value="'+r.p+'"></div>'+
  '<button class="del" type="button" data-d="'+i+'" aria-label="حذف البند">×</button></div>'}).join('');
 Array.prototype.forEach.call($('rows').querySelectorAll('input'),function(el){el.oninput=function(){rows[el.dataset.i][el.dataset.f]=el.dataset.f==='n'?el.value:num(el.value);calc()}});
 Array.prototype.forEach.call($('rows').querySelectorAll('.del'),function(b){b.onclick=function(){if(rows.length>1){rows.splice(b.dataset.d,1);drawRows();calc()}}});
}
function drawOpts(){
 $('opts').innerHTML=TYPES[cur].opts.map(function(o){
  var v=(vals[cur+o.id]!==undefined)?vals[cur+o.id]:o.def;
  var f=o.sel?'<select data-o="'+o.id+'">'+o.sel.map(function(s){return '<option'+(String(s)===String(v)?' selected':'')+'>'+s+'</option>'}).join('')+'</select>'
   :'<input data-o="'+o.id+'" type="number" inputmode="decimal" min="0" value="'+v+'">';
  return '<div class="opt"><label>'+o.label+'</label>'+f+'</div>'}).join('');
 Array.prototype.forEach.call($('opts').querySelectorAll('[data-o]'),function(el){var h=function(){vals[cur+el.dataset.o]=el.value;calc()};el.oninput=h;el.onchange=h});
}
function opt(id){var o=TYPES[cur].opts.filter(function(x){return x.id===id})[0];if(!o)return 0;var v=vals[cur+id];return v!==undefined?v:o.def}
function calc(){drawCalc();
 var sub=rows.reduce(function(s,r){return s+num(r.q)*num(r.p)},0);
 var cu=opt('cur'),L=[];
 L.push('<div class="minus"><span>'+(sec==='co'?'الشركة':'المخزن')+'</span><span>'+(sec==='co'?co:wr)+'</span></div>');
 var T=TYPES[cur],dp=T.ded?num(opt(T.ded.id)):0;
 var disc=sub*num(opt('disc'))/100,base=sub-disc,vat=base*num(opt('vat'))/100,wh=base*dp/100,extra=num(opt('extra'));
 var total=base+vat+extra,net=total-wh;
 if(sub===0){$('sum').innerHTML=L.join('');return}
 function line(a,b,m){L.push('<div'+(m?' class="minus"':'')+'><span>'+a+'</span><span>'+(m?'−':'')+fmt(b)+' '+cu+'</span></div>')}
 line('المجموع قبل الضريبة',sub);
 if(disc)line('الخصم',disc,1);
 line('ضريبة القيمة المضافة ('+num(opt('vat'))+'%)',vat);
 if(extra)line('مصاريف إضافية',extra);
 if(wh){line('الإجمالي',total);line(T.ded.label+' ('+dp+'%)',wh,1)}
 L.push('<div class="tot"><span>'+(wh?T.net:'الإجمالي')+'</span><span>'+fmt(wh?net:total)+' '+cu+'</span></div>');
 $('sum').innerHTML=L.join('');
}
function drawSec(){
 $('secs').innerHTML=Object.keys(SECN).map(function(k){return '<button type="button" class="type" data-s="'+k+'" aria-pressed="'+(k===sec)+'"><b>'+SECN[k][0]+'</b><small>'+SECN[k][1]+'</small></button>'}).join('');
 Array.prototype.forEach.call($('secs').children,function(b){b.onclick=function(){if(sec!==b.dataset.s){sec=b.dataset.s;cur=SEC[sec][0];drawAll()}}});
 var cb=$('coBox');cb.style.display='block';
 var isC=sec==='co',list=isC?COS:WHS,sel=isC?co:wr;
 cb.innerHTML='<div class="opt"><label for="coSel">'+(isC?'الشركة':'المخزن')+'</label><select id="coSel">'+list.map(function(c){return '<option'+(c===sel?' selected':'')+'>'+c+'</option>'}).join('')+'</select></div>';
 $('coSel').onchange=function(){if(isC)co=this.value;else wr=this.value;calc()};
}
function drawPhotos(){
 $('thumbs').innerHTML=photos.map(function(s,i){return '<div class="th"><img src="'+s+'" alt="صورة مرفقة"><button type="button" data-p="'+i+'" aria-label="حذف الصورة">×</button></div>'}).join('');
 calc();Array.prototype.forEach.call($('thumbs').querySelectorAll('button'),function(b){b.onclick=function(){photos.splice(b.dataset.p,1);pfiles.splice(b.dataset.p,1);drawPhotos()}});
}
function drawAll(){drawSec();calc()}
var busy=false;
var PROMPT='هذه صورة فاتورة (إذن استلام مسعّر) من شركة توزيع أدوية. استخرج كل أصناف الفاتورة. الأصناف تحت عنوان «أصناف خاضعة للضريبة» لها taxable=true، وتحت «أصناف غير خاضعة للضريبة» لها taxable=false. لكل صنف: name (اسم الصنف كما هو)، qty (الكمية الأساسية)، bonus (البونص: لو الكمية مكتوبة مثل 8+1 فالكمية 8 والبونص 1، وإلا 0)، unit_price (عمود سعر صيدلي للوحدة)، fixed_margin (عمود هامش ثابت للصيدلي، وصفر للأصناف الخاضعة)، line_total (عمود إجمالي القيمة كما هو مطبوع). للتحقق: في الأصناف غير الخاضعة يجب أن يساوي unit_price × qty الـ line_total. الأرقام قد تنكسر على سطرين (مثل 108.0 ثم 70 تعني 108.070). رتّب الأصناف بنفس ترتيبها في الفاتورة من الأعلى للأسفل. استخدم نقطة عشرية وأرقاماً لاتينية. invoice_number (الرقم المطبوع تحت الباركود في أعلى الفاتورة، كنص). رد بـ JSON فقط بهذا الشكل بدون أي نص آخر: {"invoice_number":"","items":[{"name":"","qty":0,"bonus":0,"taxable":false,"unit_price":0,"fixed_margin":0,"line_total":0}]}';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function drawCalc(){
 var b=$('calcBox');
 if(!pfiles.length){b.innerHTML='';$('res').innerHTML='';return}
 if(true){b.innerHTML='<button class="go" id="go" type="button"'+(busy?' disabled':'')+'>'+(busy?'جاري القراءة والحساب...':'احسب الفاتورة')+'</button>';$('go').onclick=run}
 else b.innerHTML='<p class="note">حساب الصور متاح دلوقتي في قسم الشركات بس.</p>';
}
function render(d,ib){
 var it=(d&&d.items)||[];
 if(!it.length)return 'مفيش أصناف اتقرت من الصورة.';
 var inv=d&&d.invoice_number?'<p style="margin:0 0 14px;font-size:17px"><b>رقم الفاتورة:</b> <span dir="ltr">'+esc(d.invoice_number)+'</span> <button type="button" class="cp" data-v="'+esc(d.invoice_number)+'" aria-label="نسخ رقم الفاتورة">نسخ</button></p>':'';
 var nt=it.filter(function(x){return !x.taxable}),tx=it.filter(function(x){return x.taxable});
 var hx='',tq=0,tm=0,tt=0,h='<b>الأصناف غير الخاضعة للضريبة</b><div style="overflow-x:auto"><table><tr><th>الصنف</th><th>الكمية</th><th>سعر الصيدلي</th><th>الهامش</th><th>السعر النهائي</th><th>الإجمالي</th></tr>';
 nt.forEach(function(x){var q=num(x.qty),b=num(x.bonus),n=q+b,p=num(x.unit_price),m=num(x.fixed_margin),lt=x.line_total?num(x.line_total):p*q,t=lt+m*q,f=n?t/n:0;if(ib){f=p+m;t=f*q}tq+=n;tm+=m*q;tt+=t;h+='<tr><td>'+esc(x.name)+'</td><td>'+(b?q+' + '+b:q)+'</td><td>'+fmt(p)+'</td><td>'+fmt(m)+'</td><td><b>'+fmt(f)+'</b> <button type="button" class="cp" data-v="'+f.toFixed(2)+'" aria-label="نسخ السعر">نسخ</button></td><td>'+fmt(t)+'</td></tr>'});
 h+='<tr class="tt"><td>الإجمالي (الهامش = إجمالي هامش الأصناف)</td><td>'+tq+'</td><td></td><td>'+fmt(tm)+'</td><td></td><td>'+fmt(tt)+'</td></tr></table></div>';
 if(tx.length){
  var xq=0,xt=0;
  hx='<p style="margin:0"><b>الأصناف الخاضعة للضريبة</b> <span class="note">(بعد الخصم ومع الضريبة)</span></p><div style="overflow-x:auto"><table><tr><th>الصنف</th><th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th></tr>';
  tx.forEach(function(x){var q=num(x.qty),b=num(x.bonus),n=q+b,t=num(x.line_total),u=n?t/n:0;if(ib){u=num(x.unit_price)+num(x.fixed_margin);t=u*q}xq+=n;xt+=t;hx+='<tr><td>'+esc(x.name)+'</td><td>'+(b?q+' + '+b:q)+'</td><td>'+fmt(u)+' <button type="button" class="cp" data-v="'+u.toFixed(2)+'" aria-label="نسخ السعر">نسخ</button></td><td>'+fmt(t)+'</td></tr>'});
  hx+='<tr class="tt"><td>الإجمالي</td><td>'+xq+'</td><td></td><td>'+fmt(xt)+'</td></tr></table></div>';
 }
 return inv+hx+(hx?'<div style="height:16px"></div>':'')+h;
}
var PROMPTZ='هذه صورة فاتورة من مخزن الزهراء لتوزيع الأدوية. استخرج كل الأصناف بنفس ترتيبها في الفاتورة من الأعلى للأسفل. لكل صنف: name (اسم الصنف)، qty (الكمية)، bonus (البونص إن وجد وإلا 0)، price (سعر الصنف للوحدة قبل الخصم)، discount_pct (نسبة الخصم على الصنف بالمئة، أو 0 إن لم توجد). الأرقام قد تنكسر على سطرين. استخدم نقطة عشرية وأرقاماً لاتينية. invoice_number (رقم الفاتورة المطبوع أعلى الفاتورة، كنص). رد بـ JSON فقط بهذا الشكل بدون أي نص آخر: {"invoice_number":"","items":[{"name":"","qty":0,"bonus":0,"price":0,"discount_pct":0}]}';

 var tq=0,tt=0,h=inv+'<b>الأصناف بعد الخصم</b><div style="overflow-x:auto"><table><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الخصم %</th><th>السعر بعد الخصم</th><th>الإجمالي</th></tr>';
 it.forEach(function(x){var q=num(x.qty),b=num(x.bonus),p=num(x.price),dp=num(x.discount_pct),u=p*(1-dp/100),t=u*q;tq+=q+b;tt+=t;h+='<tr><td>'+esc(x.name)+'</td><td>'+(b?q+' + '+b:q)+'</td><td>'+fmt(p)+'</td><td>'+dp+'</td><td><b>'+fmt(u)+'</b> <button type="button" class="cp" data-v="'+u.toFixed(2)+'" aria-label="نسخ السعر">نسخ</button></td><td>'+fmt(t)+'</td></tr>'});
 h+='<tr class="tt"><td>الإجمالي</td><td>'+tq+'</td><td></td><td></td><td></td><td>'+fmt(tt)+'</td></tr></table></div>';
 return h;
}
var WORKER_URL='https://bold-mouse-c0e8.ammar5005yasser.workers.dev';
function shrink(file){return new Promise(function(res,rej){var im=new Image(),u=URL.createObjectURL(file);im.onload=function(){var k=Math.min(1,1800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.9).split(',')[1])};im.onerror=rej;im.src=u})}
async function askAI(prompt,file){var b=await shrink(file);var r=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:prompt,image:b,mime:'image/jpeg'})});if(!r.ok)throw new Error('worker '+r.status);return await r.json()}

 }
 busy=false;drawCalc();
}
function fbCopy(v){var t=document.createElement('textarea');t.value=v;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(t)}
function copyVal(v){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(v).catch(function(){fbCopy(v)})}else fbCopy(v)}
